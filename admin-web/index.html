<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <script>
  (function () {
    try {
      const tenant = localStorage.getItem("tenant_branding");
      if (!tenant) return;

      const data = JSON.parse(tenant);

      if (data?.storeName) {
        document.title = data.storeName + " Admin";
      }

      if (data?.logo) {
        const link = document.querySelector("link[rel='icon']");
        if (link) link.href = data.logo;
      }
    } catch (e) {}
  })();
</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
