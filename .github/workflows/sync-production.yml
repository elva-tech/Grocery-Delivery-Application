name: Sync to Production

on:
  push:
    branches:
      - feature/develop

concurrency:
  group: sync-production-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync source branch to production
    runs-on: ubuntu-latest

    env:
      SOURCE_REPO: ${{ github.repository }}
      TARGET_REPO: elvatech-apnacart/apnacart

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve branch mapping
        id: mapping
        run: |
          SOURCE_BRANCH="${GITHUB_REF_NAME}"

          if [ "${SOURCE_BRANCH}" = "feature/develop" ]; then
            TARGET_BRANCH="develop"
          else
            echo "::error::Unsupported branch ${SOURCE_BRANCH}"
            exit 1
          fi

          echo "source_branch=${SOURCE_BRANCH}" >> $GITHUB_OUTPUT
          echo "target_branch=${TARGET_BRANCH}" >> $GITHUB_OUTPUT

      - name: Log Sync Plan
        run: |
          echo "=================================="
          echo "Source Repo   : $SOURCE_REPO"
          echo "Source Branch : ${{ steps.mapping.outputs.source_branch }}"
          echo "Target Repo   : $TARGET_REPO"
          echo "Target Branch : ${{ steps.mapping.outputs.target_branch }}"
          echo "=================================="

      - name: Configure Production Remote
        env:
          PROD_REPO_TOKEN: ${{ secrets.PROD_REPO_TOKEN }}
        run: |

          if [ -z "$PROD_REPO_TOKEN" ]; then
            echo "::error::PROD_REPO_TOKEN secret is missing"
            exit 1
          fi

          echo "PROD_REPO_TOKEN detected"
          echo "Token Length: ${#PROD_REPO_TOKEN}"

          git remote remove production 2>/dev/null || true

          git remote add production \
          https://x-access-token:${PROD_REPO_TOKEN}@github.com/elvatech-apnacart/apnacart.git

          echo "Remote configured"

      - name: Verify Production Access
        run: |
          git remote -v
          git ls-remote production

      - name: Push To Production
        run: |
          echo "Pushing ${GITHUB_REF_NAME} -> ${{ steps.mapping.outputs.target_branch }}"

          git push production \
          HEAD:refs/heads/${{ steps.mapping.outputs.target_branch }}

      - name: Success
        if: success()
        run: |
          echo "=================================="
          echo "SYNC SUCCESSFUL"
          echo "Source Branch : ${{ steps.mapping.outputs.source_branch }}"
          echo "Target Branch : ${{ steps.mapping.outputs.target_branch }}"
          echo "=================================="

      - name: Failure
        if: failure()
        run: |
          echo "=================================="
          echo "SYNC FAILED"
          echo "Check previous logs"
          echo "=================================="
